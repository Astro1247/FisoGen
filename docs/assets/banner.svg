<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FisoGen</title>
  <desc id="desc">A dark indigo banner with an illustrated mountain image and a cost chart.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#10152b"/><stop offset="1" stop-color="#25204f"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#4b51ae"/><stop offset="1" stop-color="#9eece9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b2adff" stroke-opacity=".10"/>
