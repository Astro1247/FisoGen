[package]
name = "fisogen"
version = "1.0.0"
authors = ["Astro"]
license = "MIT"
homepage = "https://zonastro.com"
description = "Portable Windows app for image generation, batch processing, and cost tracking"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "FisoGen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1"
futures-util = "0.3"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "image-without-codecs", "advanced-shaping"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "json", "multipart", "stream"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4", "v5"] }

[profile.release]
strip = true
lto = "thin"
